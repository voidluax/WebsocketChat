services:
  - type: web
    name: renderchat
    runtime: node
    plan: free
    # --- Render web service commands -------------------------------------
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # ---------------------------------------------------------------------
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Optional: attach a Postgres instance for persistent history.
      # Without DATABASE_URL the server uses its in-memory store.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: renderchat-db
      #     property: connectionString

# databases:
